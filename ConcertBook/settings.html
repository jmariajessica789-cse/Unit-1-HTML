<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings | ConcertBook</title>
    <link rel="stylesheet" href="styleaccount.css">
</head>
<body class="account-page">

    <header class="account-header">
        <a href="index.html" class="back-link">← Home</a>
        <h1>Profile <span>Settings</span></h1>
    </header>

    <main class="container">
        <div class="settings-card glass-card">
            <form id="settingsForm">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" value="GVM Fan" id="userName">
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" value="fan@concertbook.com" id="userEmail">
                </div>
                <div class="input-group">
                    <label>Mobile Number</label>
                    <input type="tel" value="+91 98765 43210">
                </div>
                
                <hr class="divider">
                
                <h3>Security</h3>
                <button type="button" class="btn-outline">Change Password</button>
                
                <div class="actions">
                    <button type="submit" class="btn-primary">Update Profile</button>
                </div>
            </form>
        </div>
    </main>

</body>
<script src="account.js"></script>
</html>
