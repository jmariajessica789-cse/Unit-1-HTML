<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Payment | ConcertBook</title>
    <link rel="stylesheet" href="stylebookwon.css"> 
</head>
<body class="booking-page">
    <div class="booking-container glass-card">
        <h2>Choose Payment Method</h2>
        <div class="modal-details" id="checkoutSummary">
            </div>

        <div class="input-group">
            <label>Payment Options</label>
            <select id="paymentMethod">
                <option value="upi">UPI (GPay / PhonePe)</option>
                <option value="card">Credit / Debit Card</option>
                <option value="netbanking">Net Banking</option>
            </select>
        </div>

        <button class="confirm-btn" onclick="executePayment()">Pay Now</button>
    </div>

    <script>
        // Display summary on load
        const checkoutData = JSON.parse(sessionStorage.getItem('pendingCheckout'));
        if(checkoutData) {
            document.getElementById('checkoutSummary').innerHTML = `
                <p><b>Pay for:</b> ${checkoutData.event}</p>
                <p><b>Amount:</b> ${checkoutData.amount}</p>
            `;
        }

        function switchMethod(method) {
    const cardForm = document.getElementById('card-form');
    const qrContainer = document.getElementById('qr-container');
    const qrImg = document.getElementById('displayQR');

    if (method === 'upi') {
        cardForm.style.display = 'none'; // Hide Card fields
        qrContainer.style.display = 'block'; // Show QR
        
        // Generate QR for the actual amount
        const data = JSON.parse(sessionStorage.getItem('pendingCheckout'));
        const price = data ? data.amount : "0";
        qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=Pay${price}`;
    } else {
        cardForm.style.display = 'block'; // Show Card fields
        qrContainer.style.display = 'none'; // Hide QR
    }
}

        function executePayment() {
    const btn = document.querySelector('.confirm-btn');
    
    // 1. Get the data passed from the concert page
    const checkoutData = JSON.parse(sessionStorage.getItem('pendingCheckout'));

    if (!checkoutData) {
        alert("Payment session expired. Please try again.");
        window.location.href = "index.html";
        return;
    }

    btn.innerText = "Processing...";
    btn.disabled = true;

    setTimeout(() => {
        // 2. Load existing tickets or start a new array
        let myTickets = JSON.parse(localStorage.getItem('myTickets')) || [];
        
        // 3. Add the new ticket to history
        myTickets.push({
            ...checkoutData,
            status: 'Confirmed',
            paymentTime: new Date().toLocaleString()
        });
        
        // 4. Save to permanent storage
        localStorage.setItem('myTickets', JSON.stringify(myTickets));
        
        // 5. Success! Go to receipt
        window.location.href = "receipt.html";
    }, 2500);
}
    </script>
</body>
</html>
