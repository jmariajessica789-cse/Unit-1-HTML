<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ConcertBook</title>
    <link rel="icon" href="music-svgrepo-com.svg" type="image/svg">
    <link rel="stylesheet" href="stylelog.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-image"></div>
    <div class="overlay"></div>
    
    <header class="main-header">
        <h1>Concert<span>Book</span></h1>
    </header>

    <main class="auth-container">
        <form id="loginForm" class="glass-card">
            <h2>Welcome Back</h2>
            <p class="subtitle">Login to access your tickets</p>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="pass" placeholder="••••••••" minlength="6" required>
                <small id="passHint" style="color: #666; font-size: 0.7rem; margin-top: 5px; display: block;">
                    Must be at least 6 characters
                </small>
            </div>

            <button type="submit" class="btn-primary">Login to Arena</button>
            
            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Register</a></p>
            </div>
        </form>
    </main>

    <script src="login.js"></script>
</body>
</html>
