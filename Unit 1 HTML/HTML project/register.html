<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the Vibe | ConcertBook</title>
    <link rel="icon" href="music-svgrepo-com.svg" type="image/svg">
    <link rel="stylesheet" href="stylereg.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-image"></div>
    <div class="overlay"></div>

    <header class="main-header">
        <h1>Concert<span>Book</span></h1>
    </header>

    <main class="auth-container">
        <form id="regForm" class="glass-card">
            <h2>Create Account</h2>
            <p class="subtitle">Join thousands of fans worldwide</p>

            <div class="form-grid">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="Alice" required>
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="alice@example.com" required>
                </div>

                <div class="input-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" placeholder="+1 234 567 890" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="pass" placeholder="••••••••" required>
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPass" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-primary">Create Account</button>
            
        </form>
    </main>
    <div id="regModal" class="modal-overlay">
    <div class="modal-card glass-card">
        <div id="modalIcon" class="modal-icon">⚠️</div>
        <h2 id="modalTitle">Wait a minute!</h2>
        <p id="modalMessage" style="color: #bbb; margin: 15px 0;">Passwords do not match.</p>
        <div class="modal-actions">
            <button class="pay-btn" style="flex: 1;" onclick="closeRegModal()">Try Again</button>
        </div>
    </div>
</div>

    <script src="register.js"></script>
</body>
</html>
