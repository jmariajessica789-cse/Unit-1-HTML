<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book HHT Tickets | ConcertBook</title>
    <link rel="stylesheet" href="stylebookhip.css">
    <link rel="icon" href="music-svgrepo-com.svg" type="image/svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body class="booking-page">

    <div class="booking-container glass-card">
        <header class="booking-header">
            <h1>Concert<span>Book</span></h1>
        </header>

        <section class="event-summary">
            <div class="event-text">
                <h2>ROTDM: The Home Coming Finale</h2>
                <p>Sat, 7 Mar | 6:30 PM • YMCA Ground, Chennai</p>
            </div>
            <img class="stadium-map" src="homecf.Screenshot 2026-01-26 144716.png" alt="YMCA Seating Layout">
        </section>

        <section class="booking-form">
            <h3>Secure Your Tickets</h3>
            
            <div class="input-group">
                <label for="type">Select Zone</label>
                <select id="type" onchange="calculateTotal()">
                    <option value="1499">General - ₹1,499</option>
                    <option value="1999">Bronze - ₹1,999</option>
                    <option value="2499">Fanpit 3 - ₹2,499</option>
                    <option value="2999">Fanpit 2 - ₹2,999</option>
                    <option value="3999">Fanpit 1 - ₹3,999</option>
                    <option value="9999">VIP - ₹9,999</option>
                </select>
            </div>

            <div class="input-group">
                <label for="qty">Quantity</label>
                <input type="number" id="qty" value="1" min="1" max="10" oninput="calculateTotal()">
            </div>

            <div class="total-display">
                <p>Final Amount: <span id="totalPrice">₹1,499</span></p>
            </div>

            <button class="confirm-btn" onclick="confirmBooking()">Confirm Booking</button>
        </section>
    </div>
    <div id="bookingModal" class="modal-overlay">
    <div class="modal-card glass-card">
        <div class="modal-icon">🎟️</div>
        <h2>Confirm Your Booking</h2>
        <div id="modalDetails" class="modal-details">
            </div>
        <div class="modal-actions">
            <button class="cancel-btn" onclick="closeModal()">Cancel</button>
            <button class="pay-btn" onclick="finalizeBooking()">Proceed to Pay</button>
        </div>
    </div>
</div>

    <script src="bookhip.js"></script>
</body>
</html>
