<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tickets | ConcertBook</title>
    <link rel="stylesheet" href="styleaccount.css">
    <link rel="icon" href="music-svgrepo-com.svg" type="image/svg">
</head>
<body class="account-page">

    <header class="account-header">
        <a href="index.html" class="back-link">← Home</a>
        <h1>My <span>Tickets</span></h1>
    </header>

    <main class="container">
        <div id="dynamicTicketList" class="ticket-list">
            <div class="loading-state">Syncing your bookings...</div>
        </div>
    </main>
    <div id="qrModal" class="modal-overlay">
    <div class="modal-card glass-card">
        <div class="modal-header">
            <h3>Your Entry Pass</h3>
            <button class="close-btn" onclick="closeQRModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div id="qrContainer" class="qr-box">
                </div>
            <div id="qrInfo" class="qr-details">
                </div>
        </div>
        <button class="btn-primary" onclick="window.print()">Download PDF</button>
    </div>
</div>

<div id="cancelModal" class="modal-overlay">
    <div class="modal-card glass-card">
        <div class="modal-icon" style="color: #ff4d4d; font-size: 3rem; margin-bottom: 15px;">⚠️</div>
        <h2>Cancel Booking?</h2>
        <p style="color: #94a3b8; margin: 15px 0;">This action cannot be undone. Your tickets for <span id="cancelEventName" style="color: white; font-weight: bold;"></span> will be removed.</p>
        
        <div class="modal-actions" style="display: flex; gap: 15px; margin-top: 25px;">
            <button class="btn-secondary" onclick="closeCancelModal()" style="flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #444; background: transparent; color: white; cursor: pointer;">Go Back</button>
            <button class="btn-danger" id="confirmCancelBtn" style="flex: 1; padding: 12px; border-radius: 10px; border: none; background: #ff4d4d; color: white; font-weight: bold; cursor: pointer;">Yes, Cancel</button>
        </div>
    </div>
</div>

    <script src="account.js"></script>
</body>
</html>
