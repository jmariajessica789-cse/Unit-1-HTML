<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Sunidhi Chauhan Tickets | ConcertBook</title>
    <link rel="stylesheet" href="stylebookiah.css">
    <link rel="icon" href="music-svgrepo-com.svg" type="image/svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body class="booking-page">

    <div class="booking-container glass-card">
        <header class="booking-header">
            <h1>Concert<span>Book</span></h1>
        </header>

        <section class="event-summary">
            <div class="event-text">
                <h2><a href="iamhome.html" class="back-arrow">👈🏻</a> Sunidhi Chauhan: I Am Home</h2>
                <p>Sat, 7 Feb | 7:00 PM • Chennai</p>
            </div>
            <img class="venue-map" src="iah.Screenshot 2026-01-26 151127.png" alt="Seating Layout" width="500" height="500" style="border-radius: 12px;">
        </section>

        <section class="booking-form">
            <h3>Secure Your Spot</h3>
            
            <div class="input-group">
                <label for="type">Ticket Category</label>
                <select id="type" onchange="calculateTotal()">
                    <option value="2500">Silver - ₹2,500</option>
                    <option value="3500">Gold - ₹3,500</option>
                    <option value="5000">Platinum - ₹5,000</option>
                    <option value="8000">Fanpit - ₹8,000</option>
                    <option value="15000">Lounge - ₹15,000</option>
                </select>
            </div>

            <div class="input-group">
                <label for="qty">Quantity</label>
                <input type="number" id="qty" value="1" min="1" max="10" oninput="calculateTotal()">
            </div>

            <div class="total-display">
                <p>Payable Amount</p>
                <h2 id="totalPrice">₹2,500</h2>
            </div>

            <button class="confirm-btn" onclick="confirmBooking()">Confirm Booking</button>
        </section>
    </div>
    <div id="bookingModal" class="modal-overlay">
    <div class="modal-card glass-card">
        <div class="modal-icon">🎟️</div>
        <h2>Confirm Your Booking</h2>
        <div id="modalDetails" class="modal-details">
            </div>
        <div class="modal-actions">
            <button class="cancel-btn" onclick="closeModal()">Cancel</button>
            <button class="pay-btn" onclick="finalizeBooking()">Proceed to Pay</button>
        </div>
    </div>
</div>

    <script src="bookiah.js"></script>
</body>
</html>
