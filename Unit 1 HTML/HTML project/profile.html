<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | ConcertBook</title>
    <link rel="stylesheet" href="profile.css">
    <link rel="icon" href="music-svgrepo-com.svg" type="image/svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body class="profile-page">

    <header class="main-header">
        <div class="header-container">
            <a href="index.html" class="back-link">← Back to Home</a>
            <h1 class="logo">Concert<span>Book</span></h1>
        </div>
    </header>

    <main class="profile-wrapper">
        <div class="profile-card glass-card">
            <div class="user-id-section">
                <div class="avatar-circle">
                    <span id="avatarInitial">G</span>
                </div>
                <div class="user-meta">
                    <h2 id="displayFullName">Guest Fan</h2>
                    <p class="membership-tag">VIP Member</p>
                </div>
            </div>

            <hr class="cyber-divider">

            <div class="details-grid">
                <div class="detail-item">
                    <label>Email Address</label>
                    <p id="displayEmail">fan@concertbook.com</p>
                </div>
                <div class="detail-item">
                    <label>Phone Number</label>
                    <p id="displayPhone">+91 98765 43210</p>
                </div>
                <div class="detail-item">
                    <label>Home City</label>
                    <p id="displayCity">Chennai, India</p>
                </div>
                <div class="detail-item">
                    <label>Account Status</label>
                    <p class="status-verified">✓ Verified</p>
                </div>
            </div>

            <div class="profile-actions">
                <a href="settings.html" class="edit-btn">Edit Profile</a>
                <a href="myticket.html" class="ticket-link">View My Tickets</a>
            </div>
        </div>
    </main>

    <script src="account.js"></script>
</body>
</html>
