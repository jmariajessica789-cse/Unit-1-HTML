<!DOCTYPE html>
<html>
  <head>
     <title>Web Technology</title>
  </head>
  <body>
    <table border="2" cellpadding="10" cellspacing="2">
            <tr>
               <th>S.NO</th>
               <th>NAME</th>
               <th>AGE</th>
            </tr>
            <tr>
               <td>1</td>
               <td>Alice</td>
               <td>18</td>
            </tr>
            <tr>
               <td>2</td>
               <td>Justine</td>
               <td>19</td>
            </tr>
              <tr>
               <td>3</td>
               <td>Mark</td>
               <td>17</td>
            </tr>
            <tr>
               <td>4</td>
               <td>Janne</td>
               <td>19</td>
            </tr>
            <tr>
               <td>5</td>
               <td>Denifa</td>
               <td>17</td>
            </tr><br>
    </table>
    <br><br>
    <!--span example-->
    <table border="2" cellpadding="10" cellspacing="2">
      
      <tr>
        <th>S.NO</th>
        <th>NAME</th>
        <th>AGE</th>
      </tr>

      <!-- Rowspan Example -->
      <tr>
        <td rowspan="2">1</td>
        <td>Julie</td>
        <td>18</td>
      </tr>
      <tr>
        <td>Mathew</td>
        <td>17</td>
      </tr>

      <!-- Normal Row -->
      <tr>
        <td>3</td>
        <td>Dania</td>
        <td>17</td>
      </tr>

      <!-- Colspan Example -->
      <tr>
        <td>4</td>
        <td colspan="2">Felshida (19 Years Old)</td>
      </tr>

      <!-- Extra Row Added -->
      <tr>
        <td>5</td>
        <td>Irene</td>
        <td>17</td>
      </tr>
    </table>
  </body>
</html>
